services:
    mongo:
        image: mongo:8.0
        command: ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--keyFile', '/mongo-keyfile/mongo-replica-keyfile']
        restart: unless-stopped
        depends_on:
            mongo-keyfile-init:
                condition: service_completed_successfully
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
            MONGO_INITDB_DATABASE: mammi
        volumes:
            - mongo_dev_data:/data/db
            - mongo_replica_keyfile:/mongo-keyfile
        healthcheck:
            test:
                - CMD-SHELL
                - mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep 1
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s

    mongo-keyfile-init:
        image: mongo:8.0
        restart: 'no'
        command:
            - /bin/sh
            - -ec
            - >-
                cp /run/secrets/mongo-replica-keyfile /mongo-keyfile/mongo-replica-keyfile
                && chown 999:999 /mongo-keyfile/mongo-replica-keyfile
                && chmod 400 /mongo-keyfile/mongo-replica-keyfile
        volumes:
            - mongo_replica_keyfile:/mongo-keyfile
        secrets:
            - mongo-replica-keyfile
    mongo-replica-init:
        image: mongo:8.0
        restart: 'no'
        depends_on:
            mongo:
                condition: service_healthy
        environment:
            MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
            MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
        command:
            - /bin/sh
            - -ec
            - >-
                mongosh --quiet --host mongo:27017 --username "$${MONGO_ROOT_USERNAME}" --password "$${MONGO_ROOT_PASSWORD}" --authenticationDatabase admin --eval 'try { rs.status().ok } catch (error) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] }).ok }'

    backend:
        build:
            context: ./be
            target: build
        command: npm run dev
        restart: unless-stopped
        depends_on:
            mongo-replica-init:
                condition: service_completed_successfully
        environment:
            MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/mammi?authSource=admin&replicaSet=rs0
            SERVER_BACKUP_PORT: 8080
            FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3002}
            ORDER_WEB_URL: ${ORDER_WEB_URL:-http://localhost:3001}
            PUBLIC_ORDER_REALTIME_PRIVATE_KEY: ${PUBLIC_ORDER_REALTIME_PRIVATE_KEY:?Set PUBLIC_ORDER_REALTIME_PRIVATE_KEY in .env}
            TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY in .env}
            ACCESS_TOKEN_PRIVATE_KEY: ${ACCESS_TOKEN_PRIVATE_KEY:?Set ACCESS_TOKEN_PRIVATE_KEY in .env}
            REFRESH_TOKEN_PRIVATE_KEY: ${REFRESH_TOKEN_PRIVATE_KEY:?Set REFRESH_TOKEN_PRIVATE_KEY in .env}
            DEFAULT_SUPERADMIN_ACCOUNT: ${DEFAULT_SUPERADMIN_ACCOUNT:-superadmin}
            DEFAULT_SUPERADMIN_PASSWORD: ${DEFAULT_SUPERADMIN_PASSWORD:?Set DEFAULT_SUPERADMIN_PASSWORD in .env}
            CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
            CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
            CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
            LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
            LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
            CHOKIDAR_USEPOLLING: 'true'
        volumes:
            - ./be:/app
            - backend_node_modules:/app/node_modules
        ports:
            - '8080:8080'

    frontend:
        build:
            context: ./fe
            target: build
            args:
                NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
                NEXT_PUBLIC_ORDER_WEB_URL: ${NEXT_PUBLIC_ORDER_WEB_URL:-http://localhost:3001}
        command: npm run dev -- --hostname 0.0.0.0
        restart: unless-stopped
        depends_on:
            - backend
        environment:
            PORT: 3000
            NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
            NEXT_PUBLIC_ORDER_WEB_URL: ${NEXT_PUBLIC_ORDER_WEB_URL:-http://localhost:3001}
            INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8080}
            NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
            NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3002}
            WATCHPACK_POLLING: 'true'
            CHOKIDAR_USEPOLLING: 'true'
        volumes:
            - ./fe:/app
            - frontend_node_modules:/app/node_modules
        ports:
            - '3002:3000'

    order-web:
        build:
            context: ./order-web
            target: build
            args:
                NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?Set NEXT_PUBLIC_TURNSTILE_SITE_KEY in .env}
        command: npm run dev -- --hostname 0.0.0.0
        restart: unless-stopped
        depends_on:
            - backend
        environment:
            PORT: 3000
            NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?Set NEXT_PUBLIC_TURNSTILE_SITE_KEY in .env}
            WATCHPACK_POLLING: 'true'
            CHOKIDAR_USEPOLLING: 'true'
        volumes:
            - ./order-web:/app
            - order_web_node_modules:/app/node_modules
        ports:
            - '3001:3000'

    backup:
        build:
            context: ./backup
        restart: unless-stopped
        depends_on:
            mongo:
                condition: service_healthy
        environment:
            BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
            MONGO_HOST: mongo
            MONGO_DATABASE: mammi
            MONGO_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
            MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
            RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
            RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
            AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
            AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
            AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
            BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
            BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
            BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
            BACKUP_POLL_INTERVAL_SECONDS: ${BACKUP_POLL_INTERVAL_SECONDS:-60}
            BACKUP_RETRY_DELAY_SECONDS: ${BACKUP_RETRY_DELAY_SECONDS:-300}
            BACKUP_MAX_ATTEMPTS: ${BACKUP_MAX_ATTEMPTS:-5}

    # cloudflared:
    #     image: cloudflare/cloudflared:latest
    #     restart: unless-stopped
    #     command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    #     depends_on:
    #         - order-web
    #         - backend

volumes:
    mongo_dev_data:
        name: mammi_mongo_dev_data
    backend_node_modules:
    frontend_node_modules:
    order_web_node_modules:

    mongo_replica_keyfile:

secrets:
    mongo-replica-keyfile:
        file: ${MONGO_REPLICA_KEYFILE:-./secrets/mongo-keyfile}
